<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FunPay &amp; Playerok Castor</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script src="tg-lite.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" hidden>
  <form class="login" onsubmit="pwLogin(event)">
    <img src="logo.svg" alt="" width="56" height="56" style="border-radius:16px">
    <h1>FunPay &amp; Playerok Castor</h1>
    <p class="hint" id="lhint">Войдите паролем веб-панели. В Telegram вход автоматический, если вы в команде бота.</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn wide" type="submit">Войти</button>
    <p class="err" id="lerr" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="duo" id="duo"></header>
  <main id="view" tabindex="-1"></main>
  <div class="savebar" id="savebar" hidden>
    <span>Есть несохранённые изменения</span>
    <button class="btn" onclick="saveCfg()">Сохранить</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
    <button data-tab="chats"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Чаты</button>
    <button data-tab="sales"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Заказы</button>
    <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<script src="app.js"></script>
</body>
</html>
